events {}

http {
  log_format sha '$request_method $uri $status upstream=$upstream_addr';
  access_log /var/log/nginx/access.log sha;

  upstream sha_backend {
    server backend-a:8010;
    server backend-b:8010;
  }

  upstream sha_frontend {
    server frontend:3010;
  }

  server {
    listen 8080;

    location /api/ {
      proxy_pass http://sha_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-SHA-External-Auth "";
      proxy_set_header X-SHA-External-Role "";
      proxy_set_header X-SHA-External-User "";
    }

    location /health {
      proxy_pass http://sha_backend;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://sha_frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
